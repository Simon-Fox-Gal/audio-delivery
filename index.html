<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07130f">
  <meta name="description" content="Audio Delivery · Simon Fox">
  <title>Audio Delivery · Simon Fox</title>
  <style>
    :root { --night:#06110d; --ink:#f3efe4; --muted:#aeb5aa; --gold:#d5b465; --gold-soft:#f1d99c; --line:rgba(213,180,101,.24); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; color:var(--ink); background:radial-gradient(circle at 76% 18%,rgba(54,111,79,.28),transparent 32rem),radial-gradient(circle at 18% 82%,rgba(133,94,33,.13),transparent 27rem),var(--night); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.6; }
    body::before { content:""; position:fixed; inset:0; opacity:.28; pointer-events:none; background-image:radial-gradient(circle,rgba(255,255,255,.65) 0 1px,transparent 1.2px); background-size:151px 151px; mask-image:linear-gradient(to bottom,black,transparent 84%); }
    main { position:relative; width:min(920px,calc(100% - 34px)); padding:80px 0; }
    .eyebrow { margin:0 0 18px; color:var(--gold); font-size:.72rem; font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
    h1,h2 { font-family:Georgia,"Times New Roman",serif; font-weight:400; }
    h1 { margin:0; font-size:clamp(3.5rem,10vw,7.8rem); line-height:.9; letter-spacing:-.055em; }
    .intro { max-width:590px; margin:28px 0 48px; color:var(--muted); font-size:1.08rem; }
    .release { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:28px; align-items:center; padding:clamp(25px,4vw,38px); border:1px solid var(--line); border-radius:22px; background:linear-gradient(145deg,rgba(25,49,37,.9),rgba(10,27,20,.84)); box-shadow:0 28px 80px rgba(0,0,0,.34); }
    .release-label { color:var(--gold); font-size:.67rem; font-weight:700; letter-spacing:.17em; text-transform:uppercase; }
    h2 { margin:8px 0 4px; color:var(--gold-soft); font-size:clamp(1.7rem,4vw,2.5rem); line-height:1.08; }
    .release p { margin:0; color:var(--muted); }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 20px; border-radius:999px; color:#122018; background:linear-gradient(135deg,var(--gold-soft),var(--gold)); text-decoration:none; font-size:.88rem; font-weight:700; white-space:nowrap; transition:transform .2s ease; }
    a:hover { transform:translateY(-2px); }
    footer { margin-top:38px; color:#818a81; font-size:.75rem; }
    @media(max-width:680px){ .release{grid-template-columns:1fr;} a{justify-self:start;} }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Simon Fox · Audio Delivery</p>
    <h1>Veröffentlichungen</h1>
    <p class="intro">Interne Bereitstellung von Audiofassungen, Produktionsständen und ergänzenden Projektinformationen.</p>
    <article class="release">
      <div>
        <span class="release-label">Version vom 16.08.26</span>
        <h2>Die Rückkehr zum Ursprung</h2>
        <p>Meditation · Dieter Broers</p>
      </div>
      <a href="die-rueckkehr-zum-ursprung/">Zur Audio-Lieferung →</a>
    </article>
    <footer>Interner Projektbereich</footer>
  </main>
</body>
</html>
