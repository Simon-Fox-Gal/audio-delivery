<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" aria-labelledby="title desc">
  <title id="title">Die Rückkehr zum Ursprung</title><desc id="desc">Abstrakte Erde, umgeben von Klangringen und sechs leuchtenden Stationen.</desc>
