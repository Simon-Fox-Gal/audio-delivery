name: Build De profundis continuous listening stream

on:
  push:
    paths:
      - .github/workflows/publish-de-profundis.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out listening-page repository
        uses: actions/checkout@v4
      - name: Prepare Google Drive downloader
        run: |
          python3 -m venv /tmp/gdown-env
          /tmp/gdown-env/bin/pip install -q gdown
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download the link-shared preliminary master
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -f /tmp/de-profundis-source.mp3
            if /tmp/gdown-env/bin/gdown 1mFwOWHHOsv0rKe3kGkFnGRyZf3X2lt27 -O /tmp/de-profundis-source.mp3; then
              break
            fi
            echo "Download attempt $attempt failed"
            sleep 10
          done
          test -f /tmp/de-profundis-source.mp3
          test "$(stat -c %s /tmp/de-profundis-source.mp3)" -eq 175778049
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 /tmp/de-profundis-source.mp3
      - name: Encode continuous stereo audio as browser-compatible HLS
        shell: bash
        run: |
          set -euo pipefail
          dest="de-profundis-agm-preview/audio/complete"
          mkdir -p "$dest"
          rm -f "$dest"/part-*.ts "$dest"/index.m3u8
          ffmpeg -hide_banner -nostdin -loglevel error -i /tmp/de-profundis-source.mp3 \
            -map 0:a:0 -vn -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -f hls -hls_time 18 -hls_playlist_type vod -hls_list_size 0 \
            -hls_segment_filename "$dest/part-%03d.ts" "$dest/index.m3u8"
          test -s "$dest/index.m3u8"
          grep -q '#EXT-X-ENDLIST' "$dest/index.m3u8"
          du -sh "$dest"
      - name: Commit stream segments to the existing Pages repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de-profundis-agm-preview/audio/complete/
          if ! git diff --cached --quiet; then
            git commit -m "Publish continuous five-movement De profundis listening stream"
            git push
          fi
