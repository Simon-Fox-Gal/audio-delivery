name: Publish Lebenskreise listening derivatives
on:
  push:
    paths:
      - .github/workflows/publish-lebenskreise.yml
      - lebenskreise/tools/build_audio.py
      - lebenskreise/sources.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lebenskreise-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m venv /tmp/lebenskreise-env
          /tmp/lebenskreise-env/bin/pip install -q gdown numpy
      - name: Verify originals and produce listening copies
        run: /tmp/lebenskreise-env/bin/python lebenskreise/tools/build_audio.py --wav-dir /tmp/lebenskreise-wav --download
      - name: Publish verified derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lebenskreise/audio/ lebenskreise/audio-inventory.json lebenskreise/recording.json lebenskreise/klangkreise.svg
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Lebenskreise stream and six MP3 listening copies"
            git push
          fi
